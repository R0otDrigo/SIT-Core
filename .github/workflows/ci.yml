name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ qt6-base-dev libgl1-mesa-dev
      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build -j
      - name: Pruebas
        run: ctest --test-dir build --output-on-failure
